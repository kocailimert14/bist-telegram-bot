name: Kripto Evan Cabral Tarayıcı

on:
  workflow_dispatch:
  schedule:
    # Sabah 08:00 ile gece 23:59 TSİ arasında her 15 dakikada bir çalışır (05:00 - 20:59 UTC)
    # Gece 00:00 ile 08:00 TSİ arası tamamen durur
    - cron: '*/15 5-20 * * *'

jobs:
  kripto_tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Kripto Tarama Kodunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_main.py
