name: ABD Borsası Evan Cabral Tarayıcı

on:
  workflow_dispatch:
  schedule:
    # Türkiye saatiyle 16:30 - 23:00 arası her saat 20 geçe ve 50 geçelerde çalışır
    # TSİ 16:50 = 13:50 UTC, TSİ 22:50 = 19:50 UTC
    - cron: '20,50 13-19 * * 1-5'

jobs:
  us_tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: ABD Tarama Kodunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python us_main.py
