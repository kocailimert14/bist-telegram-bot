name: OSCAR 3m Telegram Scanner

on:
  schedule:
    # Her 20 dakikada bir otomatik çalışır
    - cron: '*/20 * * * *'
  workflow_dispatch: # Actions sekmesinden elle tek tıkla test başlatabilmeniz için

jobs:
  oscar_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Proje Kodunu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: OSCAR 3m Tarayıcısını Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python oscar_scanner_3m.py --loop --duration 18
