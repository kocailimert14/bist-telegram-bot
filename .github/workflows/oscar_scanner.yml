name: OSCAR 3m Telegram Scanner

on:
  schedule:
    # Her 5 saatte bir yeni nöbeti başlatır
    - cron: '0 */5 * * *'
  workflow_dispatch: # İstediğiniz an tek tıkla başlatabilmeniz için

jobs:
  oscar_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Proje Kodunu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: OSCAR 3m Tarayıcısını Çalıştır (5 Saat Kesintisiz)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 300 dakika (5 saat) boyunca her 3 dakikada bir canlı tarar
          python oscar_scanner_3m.py --loop --duration 300
